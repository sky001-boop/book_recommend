
services:
  mysql:
    image: mysql:8.0
    container_name: brs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: book_recommend
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data/import_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: brs-redis

  backend:
    build: ./backend
    container_name: brs-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      model-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/book_recommend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MODEL_SERVICE_BASE_URL: http://model-service:8000
      LLM_API_KEY: ${LLM_API_KEY:-}

  # 模型推理服务：双塔召回(Faiss) + DeepFM 精排(ONNX) + RAG 语义检索
  model-service:
    build: ./model-service
    container_name: brs-model
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: brs-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
