# 服务端口
server.port=8080


# MySQL配置
spring.datasource.url=jdbc:mysql://localhost:3306/book_recommend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai

spring.datasource.username=root

spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# MyBatis配置

mybatis.mapper-locations=classpath:mapper/*.xml

mybatis.type-aliases-package=com.bookrecommend.backend.entity


# Redis 配置
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

# Spring Cache 使用 Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.key-prefix=brs:

# 模型推理服务（双塔召回 + DeepFM 精排，算法侧/工程侧解耦）
model.service.base-url=http://localhost:8000
model.service.timeout-ms=3000
model.service.enabled=true

# 日志
logging.level.com.bookrecommend.backend=debug